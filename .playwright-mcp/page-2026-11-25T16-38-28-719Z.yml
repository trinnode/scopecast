          - heading "Revoke once. Enforce everywhere." [level=1] [ref=f1e19]: Revoke once.Enforce everywhere.
          - paragraph [ref=f1e20]: SCOPECAST gives a protocol one authoritative policy for a delegated DeFi agent. A Reactive contract mirrors every versioned change to integrated execution modules on another chain — and the module refuses the next action once the newer epoch arrives.
