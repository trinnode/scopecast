      - generic [ref=f1e63]:
        - generic [ref=f1e64]: THE SECURITY PROPERTY
        - heading "One policy, three verifiable stages" [level=2] [ref=f1e65]
        - generic [ref=f1e66]:
          - generic [ref=f1e67]:
            - heading "Versioned source policy" [level=3] [ref=f1e72]
            - paragraph [ref=f1e73]: Agent key, target module, method selector, value cap, expiry and epoch are written to a single registry. Every change increments the epoch.
          - generic [ref=f1e74]:
            - heading "Authenticated reaction" [level=3] [ref=f1e82]
            - paragraph [ref=f1e83]: A Reactive contract validates origin chain, registry address, event signature and payload hash before requesting a callback. Stale epochs never win.
          - generic [ref=f1e84]:
            - heading "Enforced at the module" [level=3] [ref=f1e88]
            - paragraph [ref=f1e89]: A guarded vault checks the mirrored policy on every agent call. After the revoke callback lands, the exact same call is rejected on-chain.
      - generic [ref=f1e91]:
        - generic [ref=f1e92]:
          - generic [ref=f1e93]: WHAT THIS IS — AND IS NOT
          - heading "A coordination layer, not magic" [level=2] [ref=f1e94]
          - paragraph [ref=f1e95]: SCOPECAST synchronises capability state for modules that integrate its guard. It is not a smart wallet, an approval scanner, a price-driven circuit breaker or a universal revoker.
        - list [ref=f1e96]:
          - listitem [ref=f1e97]: No retroactive reversal of settled transactions
          - listitem [ref=f1e101]: Propagation window between source and destination
          - listitem [ref=f1e105]: Only integrated modules query the mirror
          - listitem [ref=f1e109]: Source owner must be a multisig in production
          - listitem [ref=f1e113]: Callback gas reserve must stay funded
          - listitem [ref=f1e117]: Testnet chain parameters can change
