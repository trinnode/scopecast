    - main [ref=f10e19]:
      - generic [ref=f10e20]:
        - generic [ref=f10e21]:
          - generic [ref=f10e22]: CONFIGURE · ARCHITECTURE
          - heading "Three chains, one versioned capability" [level=1] [ref=f10e25]
          - paragraph [ref=f10e26]: SCOPECAST is a coordination layer for integrated contracts. It is not a smart wallet, approval scanner, universal revoker or price-driven circuit breaker.
        - generic [ref=f10e28]:
          - generic [ref=f10e29]:
            - generic [ref=f10e30]: "01"
            - heading "PolicyHub · Base Sepolia 84532" [level=2] [ref=f10e33]
            - paragraph [ref=f10e34]: Owner-only registry. create / update / revoke / rotate each increment a monotonic epoch and emit PolicyUpdated with all capability fields and a canonical policy hash. The agent cannot modify its own policy.
          - generic [ref=f10e35]:
            - generic [ref=f10e36]: "02"
            - heading "ScopeCastReactive · Reactive Omni 5318007" [level=2] [ref=f10e39]
            - paragraph [ref=f10e40]: Subscribed to the exact hub address and topic0. react() validates chain ID, emitter, topic count, event signature, destination chain/module and policy hash before requesting a callback. Irrelevant logs return without reverting.
          - generic [ref=f10e41]:
            - generic [ref=f10e42]: "03"
            - heading "PolicyMirror · Unichain Sepolia 1301" [level=2] [ref=f10e45]
            - paragraph [ref=f10e46]: Accepts callbacks only from the official callback proxy and the authorised reactive sender. Applies strictly newer epochs only. Idempotent under duplicate delivery; stale callbacks cannot reactivate a revoked policy.
          - generic [ref=f10e47]:
            - generic [ref=f10e48]: "04"
            - heading "GuardedDeFiVault · Unichain Sepolia 1301" [level=2] [ref=f10e51]
            - paragraph [ref=f10e52]: The only agent entry point reads the mirror and checks active, agent, chain, target, selector, expiry and cap. Successful actions move test tokens between two internal positions and emit an auditable event.
        - generic [ref=f10e53]:
          - generic [ref=f10e54]:
            - generic [ref=f10e55]: TRUST BOUNDARIES
            - list [ref=f10e58]:
              - listitem [ref=f10e59]:
                - strong [ref=f10e60]: "Trusted:"
                - text: source owner transaction (use a multisig in production).
              - listitem [ref=f10e61]:
                - strong [ref=f10e62]: "Authenticated:"
                - text: reactive callback via proxy + sender identity.
              - listitem [ref=f10e63]:
                - strong [ref=f10e64]: "Hostile:"
                - text: agent calldata, opaque event bytes, any unregistered module.
              - listitem [ref=f10e65]:
                - strong [ref=f10e66]: "Asynchronous:"
                - text: the window between source finality and destination callback is real and visible.
          - generic [ref=f10e67]:
            - generic [ref=f10e68]: ORDERING INVARIANTS
            - list [ref=f10e71]:
              - listitem [ref=f10e72]: Destination epoch never decreases.
              - listitem [ref=f10e73]: Callback at epoch n cannot modify state at epoch n or above.
              - listitem [ref=f10e74]: Inactive latest policy blocks every guarded action.
              - listitem [ref=f10e75]: Unrelated source events cannot modify the mirror.
              - listitem [ref=f10e76]: Policy hash binds all capability fields across chains.
