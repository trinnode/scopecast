      - generic [ref=f16e69]:
        - generic [ref=f16e70]:
          - generic [ref=f16e71]: 01 · The problem
          - heading "Delegated authority is fragmented across integrations." [level=2] [ref=f16e74]
          - paragraph [ref=f16e75]: An autonomous agent can hold scoped permissions in several protocol integrations and on several chains. Each integration keeps its own local state. Revoking one session on one chain does not update the others until someone submits a separate transaction to each of them.
        - generic [ref=f16e76]:
          - generic [ref=f16e78]:
            - generic [ref=f16e79]: "01"
            - heading "No single control plane" [level=3] [ref=f16e80]
            - paragraph [ref=f16e81]: The owner has to find and update every integration where the agent has authority.
          - generic [ref=f16e83]:
            - generic [ref=f16e84]: "02"
            - heading "Operational delay" [level=3] [ref=f16e85]
            - paragraph [ref=f16e86]: Each chain-specific update is a separate transaction with its own confirmation time.
          - generic [ref=f16e88]:
            - generic [ref=f16e89]: "03"
            - heading "No shared proof" [level=3] [ref=f16e90]
            - paragraph [ref=f16e91]: There is no canonical trail linking a source revocation to destination enforcement.
      - generic [ref=f16e93]:
        - generic [ref=f16e94]:
          - generic [ref=f16e95]: 02 · How it works
          - heading "Four steps, each independently verifiable." [level=2] [ref=f16e98]
        - generic [ref=f16e99]:
          - generic [ref=f16e101]:
            - text: "01"
            - heading "Authorise on source" [level=3] [ref=f16e102]
            - paragraph [ref=f16e103]: The owner calls PolicyHub on Base Sepolia. Every create, update, rotate and revoke increments an epoch and emits PolicyUpdated with all nine capability fields.
          - generic [ref=f16e105]:
            - text: "02"
            - heading "Validate in Reactive" [level=3] [ref=f16e106]
            - paragraph [ref=f16e107]: ScopeCastReactive checks chain ID, emitter address, event signature, topic count (opCode 3) and the canonical policy hash before acting. Unrelated logs return without reverting.
          - generic [ref=f16e109]:
            - text: "03"
            - heading "Request callback" [level=3] [ref=f16e110]
            - paragraph [ref=f16e111]: The Reactive contract calls requestCallbackV_1_0 with the destination chain, mirror address, gas limit and ABI payload. The network injects the sender into the first address argument.
          - generic [ref=f16e113]:
            - text: "04"
            - heading "Enforce at the module" [level=3] [ref=f16e114]
            - paragraph [ref=f16e115]: PolicyMirror accepts only the official proxy and the authorised Reactive contract, applies strictly newer epochs, and GuardedDeFiVault checks the mirrored state on every call.
      - generic [ref=f16e117]:
        - generic [ref=f16e118]:
          - generic [ref=f16e119]: 03 · The policy
          - heading "A versioned capability, not a kill switch." [level=2] [ref=f16e122]
          - paragraph [ref=f16e123]: Every field is covered by one canonical hash. The same hash is emitted on the source, recomputed by the Reactive contract, verified again by the mirror, and carried into the audit trail.
          - paragraph [ref=f16e124]: topic0 = 0xd1601cdc83fb90b6c3071dcd453f6433b966853b9b306aeb31c20c74ebedd8c9
