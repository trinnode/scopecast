      - generic [ref=f16e158]:
        - generic [ref=f16e159]:
          - generic [ref=f16e160]: 04 · Security model
          - heading "Fail closed, in the right order." [level=2] [ref=f16e163]
        - generic [ref=f16e164]:
          - generic [ref=f16e166]:
            - heading "Dual callback authentication" [level=3] [ref=f16e170]
            - paragraph [ref=f16e171]: PolicyMirror requires onlyServiceProvider (the caller is the official callback proxy) and onlyCallbackSender (the injected sender is the one authorised Reactive contract). Neither check alone is sufficient.
          - generic [ref=f16e173]:
            - heading "Monotonic epochs" [level=3] [ref=f16e177]
            - paragraph [ref=f16e178]: A callback at epoch n is ignored if the mirror already holds epoch n or newer. A delayed revoke cannot be overwritten by an older grant, and duplicate deliveries are harmless.
          - generic [ref=f16e180]:
            - heading "Scoped execution" [level=3] [ref=f16e184]
            - paragraph [ref=f16e185]: GuardedDeFiVault checks active state, caller identity, chain, target, selector, expiry and cap. Its agent entry point accepts no arbitrary recipient or external target.
          - generic [ref=f16e187]:
            - heading "Visible failure modes" [level=3] [ref=f16e191]
            - paragraph [ref=f16e192]: The console renders SOURCE_REVOKED separately from DESTINATION_REVOKED, and shows UNKNOWN when a receipt cannot be independently verified.
        - generic [ref=f16e194]:
          - heading "Known limitations" [level=3] [ref=f16e198]
          - list [ref=f16e199]:
            - listitem [ref=f16e200]: — Propagation is asynchronous; no atomic cross-chain revocation.
            - listitem [ref=f16e201]: — Settled transactions are never reversed.
            - listitem [ref=f16e202]: — Only modules that query the mirror are protected.
            - listitem [ref=f16e203]: — Callback funding exhaustion can interrupt delivery.
            - listitem [ref=f16e204]: — The source owner must be a multisig in production.
            - listitem [ref=f16e205]: — Testnet chain parameters are rechecked before each deploy.
