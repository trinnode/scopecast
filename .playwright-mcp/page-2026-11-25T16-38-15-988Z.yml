          - generic [ref=e18]: REACTIVE OMNI BUILDATHON · EVERY SECOND COUNTS
          - heading "Revoke once. Enforce everywhere." [level=1] [ref=e19]: Revoke once.Enforce everywhere.
          - paragraph [ref=e20]: SCOPECAST gives a protocol one authoritative policy for a delegated DeFi agent. A Reactive contract mirrors every versioned change to integrated execution modules on another chain — and the module refuses the next action once the newer epoch arrives.
