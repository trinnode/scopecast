            - heading "Versioned source policy" [level=3] [ref=e72]
            - paragraph [ref=e73]: Agent key, target module, method selector, value cap, expiry and epoch are written to a single registry. Every change increments the epoch.
          - generic [ref=e74]:
            - heading "Authenticated reaction" [level=3] [ref=e82]
            - paragraph [ref=e83]: A Reactive contract validates origin chain, registry address, event signature and payload hash before requesting a callback. Stale epochs never win.
          - generic [ref=e84]:
            - heading "Enforced at the module" [level=3] [ref=e88]
            - paragraph [ref=e89]: A guarded vault checks the mirrored policy on every agent call. After the revoke callback lands, the exact same call is rejected on-chain.
      - generic [ref=e91]:
        - generic [ref=e92]:
          - generic [ref=e93]: WHAT THIS IS — AND IS NOT
          - heading "A coordination layer, not magic" [level=2] [ref=e94]
          - paragraph [ref=e95]: SCOPECAST synchronises capability state for modules that integrate its guard. It is not a smart wallet, an approval scanner, a price-driven circuit breaker or a universal revoker.
        - list [ref=e96]:
          - listitem [ref=e97]: No retroactive reversal of settled transactions
          - listitem [ref=e101]: Propagation window between source and destination
          - listitem [ref=e105]: Only integrated modules query the mirror
          - listitem [ref=e109]: Source owner must be a multisig in production
          - listitem [ref=e113]: Callback gas reserve must stay funded
          - listitem [ref=e117]: Testnet chain parameters can change
