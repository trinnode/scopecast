      - generic [ref=f1e192]:
        - generic [ref=f1e193]:
          - generic [ref=f1e194]: 04 · Security model
          - heading "Fail closed, in the right order." [level=2] [ref=f1e197]
        - generic [ref=f1e198]:
          - generic [ref=f1e200]:
            - heading "Dual callback authentication" [level=3] [ref=f1e204]
            - paragraph [ref=f1e205]: PolicyMirror requires onlyServiceProvider (the caller is the official callback proxy) and onlyCallbackSender (the injected sender is the one authorised Reactive contract). Neither check alone is sufficient.
          - generic [ref=f1e207]:
            - heading "Monotonic epochs" [level=3] [ref=f1e211]
            - paragraph [ref=f1e212]: A callback at epoch n is ignored if the mirror already holds epoch n or newer. A delayed revoke cannot be overwritten by an older grant, and duplicate deliveries are harmless.
          - generic [ref=f1e214]:
            - heading "Scoped execution" [level=3] [ref=f1e218]
            - paragraph [ref=f1e219]: GuardedDeFiVault checks active state, caller identity, chain, target, selector, expiry and cap. Its agent entry point accepts no arbitrary recipient or external target.
          - generic [ref=f1e221]:
            - heading "Visible failure modes" [level=3] [ref=f1e225]
            - paragraph [ref=f1e226]: The console renders SOURCE_REVOKED separately from DESTINATION_REVOKED, and shows UNKNOWN when a receipt cannot be independently verified.
        - generic [ref=f1e228]:
          - heading "Known limitations" [level=3] [ref=f1e232]
          - list [ref=f1e233]:
            - listitem [ref=f1e234]: — Propagation is asynchronous; no atomic cross-chain revocation.
            - listitem [ref=f1e235]: — Settled transactions are never reversed.
            - listitem [ref=f1e236]: — Only modules that query the mirror are protected.
            - listitem [ref=f1e237]: — Callback funding exhaustion can interrupt delivery.
            - listitem [ref=f1e238]: — The source owner must be a multisig in production.
            - listitem [ref=f1e239]: — Testnet chain parameters are rechecked before each deploy.
