      - generic [ref=f1e93]:
        - generic [ref=f1e94]:
          - generic [ref=f1e95]: 01 · The problem
          - heading "Delegated authority is fragmented across integrations." [level=2] [ref=f1e98]
          - paragraph [ref=f1e99]: An autonomous agent can hold scoped permissions in several protocol integrations and on several chains. Each integration keeps its own local state. Revoking one session on one chain does not update the others until someone submits a separate transaction to each of them.
        - generic [ref=f1e100]:
          - generic [ref=f1e102]:
            - generic [ref=f1e103]: "01"
            - heading "No single control plane" [level=3] [ref=f1e104]
            - paragraph [ref=f1e105]: The owner has to find and update every integration where the agent has authority.
          - generic [ref=f1e107]:
            - generic [ref=f1e108]: "02"
            - heading "Operational delay" [level=3] [ref=f1e109]
            - paragraph [ref=f1e110]: Each chain-specific update is a separate transaction with its own confirmation time.
          - generic [ref=f1e112]:
            - generic [ref=f1e113]: "03"
            - heading "No shared proof" [level=3] [ref=f1e114]
            - paragraph [ref=f1e115]: There is no canonical trail linking a source revocation to destination enforcement.
      - generic [ref=f1e117]:
        - generic [ref=f1e118]:
          - generic [ref=f1e119]: 02 · How it works
          - heading "Four steps, each independently verifiable." [level=2] [ref=f1e122]
        - generic [ref=f1e123]:
          - generic [ref=f1e125]:
            - text: "01"
            - heading "Authorise on source" [level=3] [ref=f1e126]
            - paragraph [ref=f1e127]: The owner calls PolicyHub on Base Sepolia. Every create, update, rotate and revoke increments an epoch and emits PolicyUpdated with all nine capability fields.
          - generic [ref=f1e129]:
            - text: "02"
            - heading "Validate in Reactive" [level=3] [ref=f1e130]
            - paragraph [ref=f1e131]: ScopeCastReactive checks chain ID, emitter address, event signature, topic count (opCode 3) and the canonical policy hash before acting. Unrelated logs return without reverting.
          - generic [ref=f1e133]:
            - text: "03"
            - heading "Request callback" [level=3] [ref=f1e134]
            - paragraph [ref=f1e135]: The Reactive contract calls requestCallbackV_1_0 with the destination chain, mirror address, gas limit and ABI payload. The network injects the sender into the first address argument.
          - generic [ref=f1e137]:
            - text: "04"
            - heading "Enforce at the module" [level=3] [ref=f1e138]
            - paragraph [ref=f1e139]: PolicyMirror accepts only the official proxy and the authorised Reactive contract, applies strictly newer epochs, and GuardedDeFiVault checks the mirrored state on every call.
      - generic [ref=f1e141]:
        - generic [ref=f1e142]:
          - generic [ref=f1e143]: 03 · The policy
          - heading "A versioned capability, not a kill switch." [level=2] [ref=f1e146]
          - paragraph [ref=f1e147]: Every field is covered by one canonical hash. The same hash is emitted on the source, recomputed by the Reactive contract, verified again by the mirror, and carried into the audit trail.
