<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 243.47 32" width="243.47" height="32" role="img" aria-labelledby="sc-lockup-title">
  <title id="sc-lockup-title">ScopeCast — Revoke once. Enforce everywhere.</title>
  <g transform="translate(0 0) scale(0.5)">
    <g>
    <!-- Delegator node: committed permission source -->
    <rect x="7" y="25" width="14" height="14" rx="2" fill="currentColor"/>
    <!-- Controlled signal line: originates at the delegator, stops at the gate -->
    <path d="M21 32 H30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/>
    <!-- Closed gate: the single enforcement point -->
    <rect x="30" y="18" width="5" height="28" rx="1" fill="currentColor"/>
    <!-- The channel is cut: the signal does not continue past the gate -->
    <!-- Agent node: isolated on the far side of the cut -->
    <rect x="44" y="25" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3.5"/>
    </g>
  </g>
